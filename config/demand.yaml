# 돌잔치 수요·매출 예측 파라미터.
#
# 핵심 원리: 돌잔치는 출생 후 약 12개월에 열린다.
#   → 어떤 달의 출생아 수 B(지역, m) 는 (m+12)월의 돌잔치 수요를 거의 확정적으로 예고한다.
#   → 이미 집계된 출생아 수 덕분에 향후 ~10개월 수요는 '예측'이 아니라 '관측'에 가깝다.
#
# 아래 비율(rate)은 초기 가정값(placeholder)이다.
# 제이드컴퍼니 실제 실적(data/jade_actuals.csv)과 calibration 으로 반드시 보정해야 한다.

# 돌 나이(개월). 한국 첫돌 = 12개월.
dol_age_months: 12

# --- 깔때기(funnel) 가정값 — calibration 으로 덮어씀 ---
funnel:
  # 전체 출생 중 '베뉴에서 돌잔치를 여는' 비율 (집/생략 제외)
  event_rate: 0.45
  # 제이드 서비스 가능 시장 비중 (운영 지역·공간유형 적합 범위)
  serviceable_share: 0.60
  # 서비스 가능 시장에서 제이드가 실제 잡는 점유율 (마케팅 의존, calibration 핵심)
  capture_rate: 0.04
  # 문의 → 계약 전환율
  inquiry_to_contract: 0.30
  # 건당 평균 매출 (원)
  avg_revenue_per_event_krw: 3500000

# --- 출생아 수 미래 구간 투영(이미 집계된 구간 밖) ---
projection:
  # 향후 출생아 수 전년동월 대비 계수 (저출산 추세 반영, 예: 0.96 = 매년 4% 감소)
  birth_yoy_factor: 0.95
  # 몇 개월까지 투영할지 (이 구간은 confidence='projected')
  horizon_months: 18

# --- 광고 타이밍 ---
ad_timing:
  # 가족이 돌잔치를 '계획/문의'하기 시작하는 시점 (돌 D-개월)
  planning_lead_months: 3
  # 광고가 문의로 전환되기까지의 리드타임 (개월)
  ad_lead_months: 1
  # 즉, 돌 수요월 T 에 대해 광고 집중 구간 ≈ [T-4, T-3]

# --- 지역 매핑 (KOSIS 시도/시군구 코드 ↔ 내부 지역명) ---
# KOSIS 행정구역 코드. 실제 코드는 KOSIS 메타에서 채워 넣는다(TODO).
regions:
  대구: { kosis_code: "27" }
  경북: { kosis_code: "47" }
  부산: { kosis_code: "26" }
  경남: { kosis_code: "48" }
  강원: { kosis_code: "51" }
