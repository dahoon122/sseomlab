# 대상 지역 정의. 수집기는 (region, sub_area, space_type) 조합으로 검색어를 생성합니다.
# sub_area 는 검색 다양성을 높이기 위한 세부 지역 키워드입니다. 필요에 따라 추가하세요.

regions:
  대구:
    sub_areas: [수성구, 달성군, 동구, 팔공산, 가창]
  경북:
    sub_areas: [경주, 안동, 포항, 영천, 청도, 군위, 문경, 영덕]
  부산:
    sub_areas: [기장, 해운대, 강서구, 금정구, 일광]
  경남:
    sub_areas: [김해, 양산, 통영, 거제, 남해, 하동, 창원]
  강원:
    sub_areas: [강릉, 양양, 속초, 평창, 홍천, 춘천, 고성]
