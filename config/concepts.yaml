# 컨셉 카테고리 지식베이스.
# 각 공간을 컨셉 카테고리로 분류하고, 카테고리별 기획 레퍼런스를 자동 제안하는 데 쓴다.
# 제이드컴퍼니 기획/영업/제안서 제작용 내부 자료.

# 공간 유형(space_type) → 컨셉 카테고리 매핑.
# Claude 분류가 우선이며, 매핑 없거나 불확실할 때 이 표를 기본값으로 쓴다.
space_type_to_category:
  정원카페: 정원형
  한옥카페: 한옥/고택형
  오션뷰카페: 오션뷰형
  숲속카페: 숲속/자연형
  브런치카페: 브런치/레스토랑형
  베이커리카페: 대형 베이커리카페형
  복합문화공간: 갤러리/복합문화공간형
  독채식당: 프라이빗 독채형
  기타: 브런치/레스토랑형

categories:
  정원형:
    target_customer: "자연스러운 야외·낮 예식을 원하는 30대 초중반, 스몰웨딩·가족 중심 돌잔치"
    wedding_concepts: [화이트앤그린 가든웨딩, 유러피안 가든파티, 내추럴 우드 스타일, 낮 예식]
    dol_concepts: [야외 돌상, 내추럴 그린 돌상, 피크닉형 돌잔치, 우드앤그린 베이비파티]
    color_palette: [화이트, 세이지그린, 아이보리, 연베이지]
    flower_direction: "내추럴 가든 스타일 — 유칼립투스·라넌큘러스·작약, 흐드러진 비정형 부케"
    table_setting: "원목 롱테이블, 린넨 러너, 글라스 캔들, 화이트 도자 식기"
    chair_style: "내추럴 우드 체어 / 치아바리, 잔디용 폴딩 우드체어"
    photozone_ideas: [생화 플라워 아치, 잔디 위 러그+소파, 갈런드 백드롭, 우드 사인보드]
    photo_points: [잔디 위 버진로드, 정원 아치, 자연광 낮 예식, 나무 그늘 가족컷]
    risks: [우천 시 대체공간 필요, 더위/추위 등 날씨, 벌레·잔디 관리, 음향장비 야외 세팅]
    reference_keywords: [가든웨딩, 내추럴웨딩, 화이트앤그린, 야외돌상, 피크닉돌]
    proposal_copy: "햇살과 초록이 식장이 되는 곳. 자연 그대로의 낮 예식과 야외 돌상을 제안합니다."

  한옥/고택형:
    target_customer: "전통·격식과 모던 감성을 함께 원하는 고객, 양가 어른 중시 가정"
    wedding_concepts: [모던 한옥 웨딩, 전통 한옥 웨딩, 한복 스냅, 마당 세리머니]
    dol_concepts: [낮은 좌식 돌상, 전통 돌상(색동·돌잡이), 보자기 연출, 모던 한복 돌스냅]
    color_palette: [먹색, 한지화이트, 오방색 포인트, 자연목]
    flower_direction: "절제된 동양란·매화·목련, 소담한 화기 중심 (과한 양식 플라워 지양)"
    table_setting: "좌식 또는 낮은 소반, 유기·도자기, 보자기 러너, 한지 소품"
    chair_style: "방석·좌식 / 낮은 우드 벤치, 어르신용 등받이 좌식"
    photozone_ideas: [창호·대청마루 백드롭, 보자기·도자기 오브제, 한지 등 조명, 매화·목련 가지]
    photo_points: [기와·처마 라인, 마루·창호 역광, 마당 한복컷, 돌잡이 좌식컷]
    risks: [좌식 불편(어르신·임산부), 동선 협소, 문화재형 공간 화기/촛불 제한, 주차]
    reference_keywords: [한옥웨딩, 고택웨딩, 한복스냅, 좌식돌상, 보자기연출, 도자기오브제]
    proposal_copy: "기와와 마루가 들려주는 시간. 전통의 격과 모던 한복 감성을 한 자리에 담습니다."

  오션뷰형:
    target_customer: "리조트 감성·여행지 무드를 원하는 고객, 하객 적은 데스티네이션형"
    wedding_concepts: [선셋 웨딩, 리조트 스타일, 화이트 패브릭 스타일링, 블루앤아이보리, 미니멀 플라워]
    dol_concepts: [리조트형 돌잔치, 화이트앤블루 돌상, 오션뷰 미니멀 돌상]
    color_palette: [화이트, 아이보리, 오션블루, 샌드베이지]
    flower_direction: "미니멀·바람에 어울리는 가벼운 라인 — 팜프라스·화이트 단색 위주"
    table_setting: "화이트 패브릭, 글라스·아크릴 소품, 캔들, 라탄 포인트"
    chair_style: "화이트 아크릴·고스트 체어 / 라탄·우드 체어"
    photozone_ideas: [수평선 패브릭 드레이프, 화이트 아치, 라탄 소파 세트, 선셋 실루엣존]
    photo_points: [수평선 실루엣, 선셋 역광, 통창 리플렉션, 패브릭 바람컷]
    risks: [해풍으로 패브릭·플라워 흔들림, 일몰 시간 의존(타임 압박), 역광 노출, 염분·습도]
    reference_keywords: [선셋웨딩, 오션뷰웨딩, 리조트돌, 화이트패브릭, 미니멀플라워]
    proposal_copy: "수평선과 노을이 배경이 되는 예식. 리조트에 온 듯한 오션뷰 돌잔치를 제안합니다."

  숲속/자연형:
    target_customer: "프라이빗·힐링 무드, 비일상 경험을 원하는 감성 고객"
    wedding_concepts: [포레스트 웨딩, 그린앤브라운 우디, 보태니컬 연출, 낮은 조도 무드]
    dol_concepts: [숲속 내추럴 돌상, 우드앤모스 돌상, 보태니컬 베이비파티]
    color_palette: [딥그린, 모스, 우드브라운, 아이보리]
    flower_direction: "보태니컬·이끼·고사리 등 야생감, 어두운 톤 그린 풍성하게"
    table_setting: "러프 우드, 무광 식기, 앰버 글라스, 캔들 다수"
    chair_style: "러프 우드 벤치 / 빈티지 우드 체어"
    photozone_ideas: [모스·고사리 그린월, 나무 사이 빛내림존, 앰버 캔들 테이블, 우드 슬랩 사인]
    photo_points: [나무 사이 빛내림, 안개·계곡, 그린 터널, 자연 텍스처 클로즈업]
    risks: [조도 낮아 촬영 광량 보강 필요, 벌레·습기, 진입로·주차 험로, 통신 음영]
    reference_keywords: [포레스트웨딩, 숲웨딩, 보태니컬, 우드앤모스, 자연돌상]
    proposal_copy: "도심을 벗어난 숲의 정적. 빛내림 아래 보태니컬 무드의 예식과 돌상을 제안합니다."

  루프탑/도심뷰형:
    target_customer: "트렌디·시티 감성 2030, 애프터파티형 하객 적은 예식"
    wedding_concepts: [시티뷰 선셋·나이트 웨딩, 모던 미니멀, 네온·캔들 무드, 칵테일 리셉션]
    dol_concepts: [루프탑 파티형 돌상, 모던 시티 돌상, 네온 포인트 베이비파티]
    color_palette: [블랙, 화이트, 메탈실버, 딥레드 포인트]
    flower_direction: "구조적·모던 라인 플라워, 단색 임팩트 (오키드·칼라)"
    table_setting: "하이톱·바테이블, 글라스웨어, 메탈·아크릴, 캔들월"
    chair_style: "메탈·아크릴 바스툴 / 블랙 모던 체어"
    photozone_ideas: [야경 백드롭, 네온 사이니지, 캔들월, 메탈 아치]
    photo_points: [도심 야경 보케, 선셋 스카이라인, 네온 사인, 통유리 반사]
    risks: [강풍·고층 안전, 야간 조명 의존, 소음·민원, 엘리베이터·우천 동선]
    reference_keywords: [루프탑웨딩, 시티뷰, 나이트웨딩, 칵테일리셉션, 모던돌상]
    proposal_copy: "도시의 스카이라인이 무대가 되는 밤. 모던 시티 무드의 예식과 파티형 돌상."

  브런치/레스토랑형:
    target_customer: "식사 중심·소규모 친밀형, 가성비·만족도 중시 가족"
    wedding_concepts: [레스토랑 스몰웨딩, 다이닝 중심 리셉션, 코지 캔들 무드, 미식 페어링]
    dol_concepts: [다이닝 돌잔치, 코스요리 돌상, 코지 패밀리 돌파티]
    color_palette: [웜베이지, 테라코타, 딥그린, 브라스골드]
    flower_direction: "테이블 센터피스 중심, 따뜻한 톤 계절 꽃 소담하게"
    table_setting: "세팅된 다이닝 테이블, 글라스·커틀러리, 냅킨링, 캔들"
    chair_style: "업홀스터리 다이닝 체어 / 빈티지 우드 체어"
    photozone_ideas: [센터피스 다이닝 테이블, 캔들·플라워 백드롭, 입구 웰컴 사인, 케이크존]
    photo_points: [테이블 다이닝컷, 건배·리액션, 음식 디테일, 따뜻한 실내광]
    risks: [수용인원·테이블 회전 제약, 예식 동선과 식사 동선 충돌, 주방 캐파, 소음]
    reference_keywords: [레스토랑웨딩, 다이닝돌, 스몰웨딩, 코지웨딩, 미식돌상]
    proposal_copy: "좋은 음식과 가까운 사람들. 다이닝을 중심에 둔 친밀한 예식과 돌잔치."

  갤러리/복합문화공간형:
    target_customer: "감각적·개성 강한 고객, 콘텐츠/연출 비중 큰 기획형"
    wedding_concepts: [갤러리 모던 웨딩, 아트 인스톨레이션 연출, 화이트큐브 미니멀, 전시형 세리머니]
    dol_concepts: [아트 돌상, 화이트큐브 미니멀 돌상, 오브제 중심 베이비전시]
    color_palette: [화이트, 블랙, 원포인트 비비드, 라이트우드]
    flower_direction: "오브제화된 구조 플라워, 절제+한 점 임팩트 (설치미술 감각)"
    table_setting: "미니멀 모던, 모노톤 식기, 조형 소품, 스폿 조명"
    chair_style: "디자이너 체어(임스 등) / 화이트 모던 체어"
    photozone_ideas: [화이트월+스폿 조명, 설치 오브제, 타이포 백드롭, 미니멀 아치]
    photo_points: [화이트월 인물, 작품·오브제 배경, 스폿 조명 드라마, 미니멀 라인]
    risks: [전시일정·작품 충돌, 화기/음식 반입 제한, 조명 커스텀 비용, 공간 규칙 까다로움]
    reference_keywords: [갤러리웨딩, 화이트큐브, 아트웨딩, 오브제돌상, 전시형돌]
    proposal_copy: "공간 자체가 작품이 되는 곳. 전시처럼 큐레이션한 예식과 아트 돌상."

  대형 베이커리카페형:
    target_customer: "넓은 공간·인스타 감성, 하객 많은 캐주얼 대형 행사"
    wedding_concepts: [대형 카페 웨딩, 디저트 바 연출, 파스텔 러블리, 캐주얼 스탠딩 리셉션]
    dol_concepts: [디저트테이블 돌상, 파스텔 베이비파티, 대형 포토존 돌잔치]
    color_palette: [파스텔핑크, 크림, 라이트우드, 화이트]
    flower_direction: "풍성·러블리, 디저트 테이블과 어울리는 파스텔 믹스"
    table_setting: "디저트 바·케이크 타워, 파스텔 클로스, 베이커리 소품"
    chair_style: "라이트우드 카페 체어 / 파스텔 패브릭 체어"
    photozone_ideas: [디저트테이블 백드롭, 풍선·갈런드 월, 대형 통창 자연광존, 케이크 타워]
    photo_points: [디저트테이블, 대형 통창 자연광, 포토존 월, 케이크컷]
    risks: [영업 중 일반손님과 동선 충돌, 소음·혼잡, 단독대관 협의 난도, 향/냄새]
    reference_keywords: [카페웨딩, 디저트테이블, 파스텔돌, 대형카페돌, 포토존]
    proposal_copy: "달콤한 향과 넓은 통창. 디저트 바와 포토존이 살아있는 캐주얼 예식과 돌잔치."

  프라이빗 독채형:
    target_customer: "온전한 단독대관·프라이버시 중시, 프리미엄 소규모"
    wedding_concepts: [독채 프라이빗 웨딩, 단독대관 하우스웨딩, 풀데이 대관 연출]
    dol_concepts: [단독 프라이빗 돌상, 풀데이 패밀리 돌잔치, 룸 단독 돌상]
    color_palette: [아이보리, 웜화이트, 그레이지, 우드]
    flower_direction: "공간 톤에 맞춘 맞춤형, 동선 따라 포인트 분산 연출"
    table_setting: "공간 전체 큐레이션, 통일된 톤 식기·린넨, 룸별 세팅"
    chair_style: "공간 톤 맞춤 우드/패브릭 체어, 통일 세트"
    photozone_ideas: [단독 공간 시그니처월, 입구 웰컴 사이니지, 룸별 무드존, 프라이빗 가족존]
    photo_points: [단독 공간 풀샷, 룸 무드, 프라이빗 가족컷, 입구 사이니지]
    risks: [대관료 단가 높음, 단독대관 최소보장 매출 협의, 캐파 한계, 케이터링 반입]
