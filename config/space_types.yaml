# 찾고 싶은 공간 유형. search_keywords 는 수집기 검색어 생성에 사용됩니다.
# space_type 값은 모델/출력의 분류 라벨과 일치해야 합니다.

space_types:
  - type: 정원카페
    search_keywords: [정원카페, 가든카페, 마당카페, 잔디카페]
  - type: 한옥카페
    search_keywords: [한옥카페, 고택카페, 전통찻집]
  - type: 브런치카페
    search_keywords: [브런치카페, 브런치맛집]
  - type: 독채식당
    search_keywords: [독채식당, 단독건물식당, 한정식, 독채레스토랑]
  - type: 베이커리카페
    search_keywords: [베이커리카페, 대형베이커리카페, 빵집카페]
  - type: 오션뷰카페
    search_keywords: [오션뷰카페, 바다뷰카페, 해변카페]
  - type: 숲속카페
    search_keywords: [숲속카페, 숲뷰카페, 계곡카페, 산속카페]
  - type: 복합문화공간
    search_keywords: [복합문화공간, 갤러리카페, 문화공간, 플래그십]

# --- 1차 자동 제외 키워드 ---
# 상호/카테고리/리뷰 텍스트에 아래 키워드가 강하게 나타나면 즉시 제외 후보.
exclusion_keywords:
  hard:        # 발견 즉시 제외 (이미 웨딩 전문 공간)
    - 웨딩홀
    - 예식장
    - 컨벤션
    - 웨딩베뉴
    - 웨딩컨벤션
    - 하우스웨딩
    - 가든웨딩홀
  soft:        # 가중치 감점 (과노출/전문화 신호)
    - 스몰웨딩
    - 웨딩촬영
    - 본식
    - 웨딩스냅
    - 야외예식
    - 웨딩패키지
